display_name: "Microsoft Azure AI Foundry"
description: |
  Azure AI Foundry (ai.azure.com) is Microsoft's unified platform for building
  and deploying AI solutions. Access is scoped per project: each project
  provides its own endpoint and API key, so you configure the base URL and
  credentials for the specific project you create. A new Azure account
  includes $200 of free credit for 30 days to try the services, after which
  usage is pay-per-use.
icon: "azure-light.svg"
icon_dark: "azure-dark.svg"
base_url: "https://<project>.<region>.services.ai.azure.com/models"
doc_url: "https://learn.microsoft.com/azure/ai-foundry/"
